<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign Up to car shooroom </title>
  <link rel="stylesheet" href="login-style.css">
  <link rel="stylesheet" href="style_signup.css">
</head>

<body>

  <div class="wrapper">

    <div class="signup-box">
      <form action="">
        <h2>Create An Account</h2>

        <p class="subtitle">create an account to enjoy all the service <br> without any ads for free.</p>

        <div class="input-box">
          <span class="icon">
            <ion-icon name="person"></ion-icon>
          </span>
          <input type="text" required maxlength="30" minlength="7" placeholder="">
          <label>User Name</label>
        </div>

        <div class="input-box">
          <span class="icon">
            <ion-icon name="mail"></ion-icon>
          </span>
          <input type="email" required maxlength="35" placeholder="">
          <label>Email Address</label>
        </div>

        <div class="input-box">
          <span class="icon">
            <ion-icon name="lock-closed"></ion-icon>
          </span>
          <input type="password" required maxlength="25" minlength="10" placeholder="">
          <label>Password</label>
        </div>

        <div class="input-box">
          <span class="icon">
            <ion-icon name="shield-checkmark"></ion-icon>
          </span>
          <input type="password" required maxlength="25" minlength="10" placeholder="">
          <label>Confirm Password</label>
        </div>

        <button type="submit">Create Account</button>

        <div class="register-link">
          <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

        <p style=" text-align: center; 
                     justify-content: center;
                     text-decoration: none   ;
                     color: #fff ;">        <a href="index.html">go to Home</a> </p>

      </form>
    </div>

  </div>

  <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js'></script>
  <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js'></script>
</body>
</html>
